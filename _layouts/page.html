---
layout: default
---
<section class="page-head">
  <div class="container container--narrow">
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="post-head__lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>
<div class="container container--narrow">
  <div class="post-content">
    {{ content }}
  </div>
</div>
